# Выделяем достаточно памяти для JVM и задаем правильную кодировку
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8

# Включаем стандартные флаги для Android-модулей
android.useAndroidX=true
android.enableJetifier=true

# Ускоряем сборку за счет кэширования и параллельности
org.gradle.parallel=true
org.gradle.caching=true
